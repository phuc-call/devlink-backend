name: CI - post-service

on:
  push:
    branches: [main, develop]
    paths:
      - 'post-service/**'
  pull_request:
    branches: [main]
    paths:
      - 'post-service/**'

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: post_db
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
      redis:
        image: redis:alpine
        ports:
          - 6379:6379

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven
      - name: Run tests
        working-directory: ./post-service
        run: mvn -B test
        env:
          EUREKA_CLIENT_ENABLED: 'false'
          SPRING_KAFKA_LISTENER_AUTO_STARTUP: 'false'